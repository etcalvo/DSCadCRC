<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD ↔ CRC</title>
  <meta name="description" content="Convertidor de dólares canadienses (CAD) a colones costarricenses (CRC)">
  <meta name="theme-color" content="#c8102e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>(function(){var t=localStorage.getItem('cadcrc_theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');})()</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CAD <span class="sep">↔</span> CRC</h1>
    <div class="rate-info" aria-live="polite">
      <span id="rate-value" class="rate-value"></span>
      <span id="rate-date" class="rate-date"></span>
    </div>
    <button id="theme-toggle" class="theme-btn" aria-label="Cambiar a modo oscuro">
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <main>
    <div class="card">
      <div class="field">
        <label for="cad-input">
          <span class="flag">🇨🇦</span>
          <span class="currency-name">Dólar canadiense</span>
          <span class="badge">CAD</span>
        </label>
        <div class="input-row">
          <span class="sym">$</span>
          <input type="number" id="cad-input" inputmode="decimal"
                 placeholder="0.00" min="0" step="0.01" disabled>
        </div>
      </div>

      <div class="divider" aria-hidden="true">⇅</div>

      <div class="field">
        <label for="crc-input">
          <span class="flag">🇨🇷</span>
          <span class="currency-name">Colón costarricense</span>
          <span class="badge">CRC</span>
        </label>
        <div class="input-row">
          <span class="sym">₡</span>
          <input type="number" id="crc-input" inputmode="decimal"
                 placeholder="0.00" min="0" step="0.01" disabled>
        </div>
      </div>
    </div>

    <div id="status" class="status" role="status"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
